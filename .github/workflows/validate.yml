name: Validate Study Companion

on:
  pull_request:
  push:
    branches: [agent/m0-m1-mac-loop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: review-checkout/study-companion/long-path-validation/mac-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep a nested checkout to exercise the macOS test-launch regression.
          path: review-checkout/study-companion/long-path-validation
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: review-checkout/study-companion/long-path-validation/mac-server/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit and route tests
        run: npm test
      - name: Compile TypeScript
        run: npm run build
      - name: Check the mock tutor loop
        run: npm run simulate
      - name: Check uploads, retrieval and sessions over HTTP
        run: npm run smoke
