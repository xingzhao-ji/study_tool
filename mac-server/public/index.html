<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Goodnotes Companion Tutor</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Mac companion</p>
          <h1>Goodnotes Companion Tutor</h1>
        </div>
        <div class="status-strip" aria-live="polite">
          <span id="serviceStatus" class="status-dot">Checking</span>
          <span id="providerStatus">Provider</span>
        </div>
      </header>

      <section class="workspace" aria-label="Tutor workspace">
        <form id="askForm" class="input-panel">
          <div class="field-group">
            <label for="regionText">Boxed text</label>
            <textarea id="regionText" name="regionText" rows="5" required>FOLLOW(A) includes FIRST(B)</textarea>
          </div>

          <div class="form-grid">
            <div class="field-group">
              <label for="marker">Marker</label>
              <input id="marker" name="marker" value="?" required>
            </div>
            <div class="field-group">
              <label for="courseHint">Course</label>
              <input id="courseHint" name="courseHint" value="CS 132 parsing">
            </div>
          </div>

          <div class="marker-row" aria-label="Marker shortcuts">
            <button type="button" data-marker="?">?</button>
            <button type="button" data-marker="hint?">hint?</button>
            <button type="button" data-marker="next?">next?</button>
            <button type="button" data-marker="why?">why?</button>
            <button type="button" data-marker="check?">check?</button>
            <button type="button" data-marker="err?">err?</button>
            <button type="button" data-marker="ex?">ex?</button>
          </div>

          <div class="field-group">
            <label for="nearbyContext">Nearby context</label>
            <textarea id="nearbyContext" name="nearbyContext" rows="3"></textarea>
          </div>

          <div class="action-row">
            <button id="askButton" class="primary-action" type="submit">Ask</button>
            <button id="clearButton" type="button">Clear</button>
          </div>
        </form>

        <section class="response-panel" aria-label="Tutor response">
          <div class="panel-heading">
            <h2>Response</h2>
            <span id="responseType">Ready</span>
          </div>
          <div id="intentOptions" class="intent-options" aria-live="polite"></div>
          <article id="answer" class="answer-box" aria-live="polite"></article>
        </section>
      </section>

      <section class="turns-panel" aria-label="Tutor turns">
        <div class="panel-heading">
          <h2>Turns</h2>
          <span id="turnCount">0</span>
        </div>
        <ol id="turns" class="turn-list"></ol>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
